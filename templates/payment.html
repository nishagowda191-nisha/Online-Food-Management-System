<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment - FoodZone</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #172033;
        }

        .container {

            width: 90%;

            max-width: 1000px;

            margin: 40px auto;
        }

        h1 {

            font-size: 40px;

            margin-bottom: 30px;
        }

        .box {

            background: white;

            padding: 30px;

            border-radius: 16px;

            margin-bottom: 25px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            margin-top: 18px;
        }

        input,
        textarea {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        textarea {

            min-height: 100px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {

            border: 2px solid #ffb900;
        }

        .payment-options {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-top: 15px;
        }

        .payment-option {

            border: 2px solid #ddd;

            padding: 20px;

            border-radius: 12px;

            cursor: pointer;

            text-align: center;

            transition: 0.2s;
        }

        .payment-option:hover {

            border-color: #ffb900;

            background: #fff9e6;
        }

        .payment-option input {

            width: auto;

            margin-right: 8px;
        }

        .total {

            font-size: 28px;

            font-weight: bold;

            color: #12894b;

            margin-top: 20px;
        }

        .pay-button {

            width: 100%;

            border: none;

            background: #ffb900;

            color: #111;

            padding: 16px;

            border-radius: 10px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 25px;
        }

        .pay-button:hover {

            background: #e6a600;
        }

        .error {

            background: #ffe5e5;

            color: #b00020;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

        @media(max-width: 700px) {

            .payment-options {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>💳 Payment</h1>


    {% if error %}

    <div class="error">

        ⚠️ {{ error }}

    </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('payment') }}">


        <!-- DELIVERY DETAILS -->

        <div class="box">

            <h2>📦 Delivery Details</h2>


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="customer_name"
                placeholder="Enter your full name"
                required>


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                name="phone"
                placeholder="Enter your phone number"
                required>


            <label>
                Delivery Address
            </label>

            <textarea
                name="address"
                placeholder="Enter complete delivery address"
                required></textarea>

        </div>


        <!-- PAYMENT METHOD -->

        <div class="box">

            <h2>💰 Select Payment Method</h2>


            <div class="payment-options">


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment_method"
                        value="UPI"
                        required>

                    📱 UPI

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment_method"
                        value="Card">

                    💳 Card

                </label>


                <label class="payment-option">

                    <input
                        type="radio"
                        name="payment_method"
                        value="Cash on Delivery">

                    💵 Cash on Delivery

                </label>


            </div>


            <div class="total">

                Total Amount: ₹{{ grand_total }}

            </div>


            <button
                type="submit"
                class="pay-button">

                🔒 Place Order & Pay

            </button>

        </div>

    </form>

</div>

</body>

</html>
